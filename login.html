<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — ADbridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #4A5FE8;
    --blue-dark: #3B4ED1;
    --ink: #101828;
    --muted: #6B7385;
    --faint: #93A0B4;
    --line: #E7EAF0;
    --bg: #F6F7FB;
    --card: #FFFFFF;
    --green-bg: #E7F8EF;
    --green: #1FA971;
    --grey-bg: #F1F2F5;
    --red-bg: #FDECEC;
    --red: #E0554F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }
  a { color: inherit; }

  /* ---------- nav ---------- */
  .nav { background: var(--card); border-bottom: 1px solid var(--line); }
  .nav .wrap {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding-top: 18px;
    padding-bottom: 18px;
    flex-wrap: wrap;
  }
  .brand {
    display: flex;
    flex-direction: column;
    text-decoration: none;
    color: var(--ink);
    line-height: 1.15;
  }
  .brand-name {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  .brand-name span { color: var(--blue); }
  .brand-tag { font-size: 12.5px; color: var(--faint); margin-top: 1px; }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 14.5px;
    font-weight: 500;
  }
  .nav-links span { color: var(--faint); }

  .pill-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 20px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    font-size: 14.5px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    text-decoration: none;
    transition: background .12s ease, border-color .12s ease;
  }
  .pill-btn:hover { background: var(--grey-bg); border-color: #D8DCE4; }

  /* ---------- auth shell ---------- */
  .auth-shell {
    min-height: calc(100vh - 71px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
  }
  .auth-card {
    width: 100%;
    max-width: 400px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 34px 30px 30px;
  }
  .auth-back {
    display: inline-block;
    font-size: 13.5px;
    color: var(--faint);
    text-decoration: none;
    margin-bottom: 22px;
    transition: color .12s ease;
  }
  .auth-back:hover { color: var(--ink); }

  .auth-card h1 {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.01em;
    margin: 0 0 8px;
  }
  .auth-sub {
    font-size: 14.5px;
    color: var(--muted);
    margin: 0 0 28px;
    line-height: 1.5;
  }

  .field { margin-bottom: 18px; }
  .field label {
    display: block;
    font-size: 13.5px;
    font-weight: 600;
    margin-bottom: 7px;
  }
  .field input {
    width: 100%;
    box-sizing: border-box;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--ink);
    font-family: inherit;
    font-size: 14.5px;
    transition: border-color .12s ease;
  }
  .field input:focus { outline: none; border-color: var(--blue); }
  .field input.err { border-color: var(--red); }
  .field-error {
    font-size: 12.5px;
    color: var(--red);
    margin-top: 6px;
    min-height: 1px;
  }

  .form-msg {
    display: none;
    font-size: 13.5px;
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 18px;
    line-height: 1.45;
  }
  .form-msg.show { display: block; }
  .form-msg.error { background: var(--red-bg); color: var(--red); }
  .form-msg.ok { background: var(--green-bg); color: var(--green); }

  .auth-submit { margin-top: 22px; }
  .btn-primary.btn-block {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 14px 20px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--blue), var(--blue-dark));
    color: #fff;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 10px 24px -10px rgba(74, 95, 232, 0.55);
    transition: transform .1s ease, box-shadow .1s ease, opacity .1s ease;
  }
  .btn-primary.btn-block:hover { transform: translateY(-1px); box-shadow: 0 14px 28px -10px rgba(74, 95, 232, 0.6); }
  .btn-primary.btn-block:disabled {
    background: var(--grey-bg);
    color: var(--faint);
    box-shadow: none;
    cursor: default;
    transform: none;
  }

  .auth-foot {
    text-align: center;
    font-size: 13.5px;
    color: var(--muted);
    margin: 24px 0 0;
  }
  .auth-foot a { color: var(--blue); font-weight: 600; text-decoration: none; }
  .auth-foot a:hover { text-decoration: underline; }
</style>
</head>
<body>

<nav class="nav">
  <div class="wrap">
    <a href="index.html" class="brand">
      <span class="brand-name">AD<span>bridge</span></span>
      <span class="brand-tag">Promote products. Earn on every campaign.</span>
    </a>
    <div class="nav-links">
      <span>New here?</span>
      <a href="signup.html" class="pill-btn">Create account</a>
    </div>
  </div>
</nav>

<div class="auth-shell">
  <div class="auth-card">
    <a href="index.html" class="auth-back">&larr; Back to ADbridge</a>
    <h1>Log in</h1>
    <p class="auth-sub">Welcome back. Enter your details to continue.</p>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required />
        <div class="field-error" id="email-error"></div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required />
        <div class="field-error" id="password-error"></div>
      </div>

      <div class="form-msg" id="form-msg"></div>

      <div class="auth-submit">
        <button type="submit" class="btn-primary btn-block" id="submit-btn">Log in</button>
      </div>
    </form>

    <p class="auth-foot">Not verified yet? <a href="otp.html?flow=signup">Enter your code</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
  const form = document.getElementById("login-form");
  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");
  const submitBtn = document.getElementById("submit-btn");
  const formMsg = document.getElementById("form-msg");

  function clearErrors() {
    document.querySelectorAll(".field-error").forEach((el) => (el.textContent = ""));
    document.querySelectorAll(".field input").forEach((el) => el.classList.remove("err"));
    formMsg.className = "form-msg";
    formMsg.textContent = "";
  }

  function fieldError(input, message) {
    input.classList.add("err");
    document.getElementById(input.id + "-error").textContent = message;
  }

  function showMsg(text, kind) {
    formMsg.textContent = text;
    formMsg.className = "form-msg show " + kind;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    clearErrors();

    const email = emailInput.value.trim();
    const password = passwordInput.value;
    let hasError = false;

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      fieldError(emailInput, "Enter a valid email address.");
      hasError = true;
    }
    if (!password) {
      fieldError(passwordInput, "Enter your password.");
      hasError = true;
    }
    if (hasError) return;

    submitBtn.disabled = true;
    submitBtn.textContent = "Logging in…";

    const { data, error } = await sb.auth.signInWithPassword({ email, password });

    submitBtn.disabled = false;
    submitBtn.textContent = "Log in";

    if (error) {
      // Supabase returns this message when the account exists but the
      // email has not been confirmed via the OTP step yet.
      if (/email not confirmed/i.test(error.message)) {
        sessionStorage.setItem("adbridge_pending_email", email);
        showMsg("Your email isn't verified yet. Redirecting to the code screen…", "ok");
        setTimeout(() => (window.location.href = "otp.html?flow=signup"), 1200);
        return;
      }
      showMsg(error.message, "error");
      return;
    }

    // Details confirmed — send them to their dashboard.
    window.location.href = "dashboard.html";
  });
</script>

</body>
</html>
