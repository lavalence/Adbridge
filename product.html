<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Add a Product — ADbridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
<style>
  /* Page-only additions — scoped here since these are new patterns not in styles.css */
  .form-card {
    max-width: 560px;
    margin: 0 auto;
  }
  .form-field { margin-bottom: 18px; }
  .form-field label {
    display: block;
    font-size: 13px;
    color: #93A0B4;
    margin-bottom: 6px;
  }
  .form-field input,
  .form-field textarea {
    width: 100%;
    box-sizing: border-box;
    background: rgba(233,236,241,0.04);
    border: 1px solid rgba(233,236,241,0.18);
    border-radius: 8px;
    padding: 10px 12px;
    color: #E9ECF1;
    font-family: "Inter", sans-serif;
    font-size: 14px;
  }
  .form-field textarea { min-height: 90px; resize: vertical; }
  .form-row { display: flex; gap: 16px; }
  .form-row .form-field { flex: 1; }
  .form-msg { font-size: 14px; margin-top: 10px; min-height: 20px; }
  .form-msg.error { color: #FF6B6B; }
  .form-msg.success { color: #4ADE80; }
  .dash-loading { padding: 60px 0; text-align: center; color: #93A0B4; }
  .user-chip { color: #93A0B4; font-size: 14px; }

  /* Earning type toggle */
  .earn-toggle {
    display: flex;
    gap: 10px;
  }
  .earn-toggle input[type="radio"] {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
  }
  .earn-toggle label {
    flex: 1;
    text-align: center;
    padding: 10px 12px;
    border: 1px solid rgba(233,236,241,0.18);
    border-radius: 8px;
    color: #93A0B4;
    font-size: 14px;
    cursor: pointer;
    margin-bottom: 0;
    transition: border-color .15s ease, color .15s ease, background .15s ease;
  }
  .earn-toggle input[type="radio"]:checked + label {
    border-color: #FFB020;
    color: #E9ECF1;
    background: rgba(255,176,32,0.08);
  }
  .field-hint {
    font-size: 12px;
    color: #93A0B4;
    margin: 6px 0 0;
  }

  /* Image picker */
  .image-picker {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .image-preview {
    width: 64px;
    height: 64px;
    border-radius: 8px;
    border: 1px dashed rgba(233,236,241,0.18);
    background: rgba(233,236,241,0.04);
    background-size: cover;
    background-position: center;
    flex-shrink: 0;
  }
  .image-picker input[type="file"] {
    display: none;
  }
  .image-picker-hint {
    font-size: 12px;
    color: #93A0B4;
    margin: 6px 0 0;
  }
</style>
</head>
<body>

<nav class="nav">
  <div class="wrap">
    <a href="index.html" class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 26 18" fill="none">
          <path d="M1 15 C 6 4, 20 4, 25 15" stroke="#FFB020" stroke-width="2" stroke-linecap="round"/>
          <circle cx="1" cy="15" r="2" fill="#E9ECF1"/>
          <circle cx="25" cy="15" r="2" fill="#E9ECF1"/>
        </svg>
      </span>
      ADbridge
    </a>
    <div class="nav-links"></div>
    <div class="nav-actions">
      <span class="user-chip" id="user-chip"></span>
      <button type="button" class="btn btn-ghost" id="logout-btn">Log out</button>
    </div>
  </div>
</nav>

<div id="dash-loading" class="wrap dash-loading">Loading…</div>

<div id="dash-content" style="display:none;">

  <header class="wrap section-border">
    <div class="section-head">
      <h2>Add a product</h2>
      <p>List a product for earners to promote.</p>
    </div>
  </header>

  <section class="wrap">
    <form id="product-form" class="form-card">
      <div class="form-field">
        <label for="p-name">Product name</label>
        <input type="text" id="p-name" required maxlength="120" />
      </div>

      <div class="form-field">
        <label for="p-desc">Description</label>
        <textarea id="p-desc" required maxlength="1000"></textarea>
      </div>

      <div class="form-field">
        <label>Earning type</label>
        <div class="earn-toggle">
          <input type="radio" name="earn-type" id="earn-fixed" value="fixed" checked />
          <label for="earn-fixed">Fixed interest</label>
          <input type="radio" name="earn-type" id="earn-commission" value="commission" />
          <label for="earn-commission">Commission</label>
        </div>
        <p class="field-hint">Fixed interest pays a set percentage regardless of price. Commission is based on the product price.</p>
      </div>

      <div class="form-field" id="fixed-field">
        <label for="p-fixed-rate">Fixed interest (%)</label>
        <input type="number" id="p-fixed-rate" min="0" max="100" step="0.1" />
      </div>

      <div id="commission-field" style="display:none;">
        <div class="form-field">
          <label for="p-price">Price (₦)</label>
          <input type="number" id="p-price" min="0" step="0.01" />
        </div>
        <div class="form-field">
          <label for="p-commission">Commission (%)</label>
          <input type="number" id="p-commission" min="0" max="100" step="0.1" />
        </div>
      </div>

      <div class="form-field">
        <label for="p-url">Product URL (optional)</label>
        <input type="url" id="p-url" placeholder="https://" />
      </div>

      <div class="form-field">
        <label for="p-image">Product image</label>
        <div class="image-picker">
          <div class="image-preview" id="p-image-preview"></div>
          <div>
            <button type="button" class="btn btn-ghost" id="p-image-btn">Choose from gallery</button>
            <p class="image-picker-hint" id="p-image-name">No image selected</p>
          </div>
        </div>
        <input type="file" id="p-image" accept="image/*" />
      </div>

      <button type="submit" class="btn btn-primary" id="submit-btn">List product</button>
      <div class="form-msg" id="form-msg"></div>
    </form>
  </section>

</div>

<footer class="wrap">
  <span>© 2026 ADbridge</span>
  <span>Built on a verified payout pipeline</span>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
  const loadingEl = document.getElementById("dash-loading");
  const contentEl = document.getElementById("dash-content");
  const userChip = document.getElementById("user-chip");
  const logoutBtn = document.getElementById("logout-btn");
  const form = document.getElementById("product-form");
  const submitBtn = document.getElementById("submit-btn");
  const msgEl = document.getElementById("form-msg");

  // Earning type toggle — controls which fields are shown/required
  const earnFixedRadio = document.getElementById("earn-fixed");
  const earnCommissionRadio = document.getElementById("earn-commission");
  const fixedFieldEl = document.getElementById("fixed-field");
  const commissionFieldEl = document.getElementById("commission-field");
  const priceInput = document.getElementById("p-price");
  const fixedRateInput = document.getElementById("p-fixed-rate");
  const commissionInput = document.getElementById("p-commission");

  function syncEarnType() {
    const isFixed = earnFixedRadio.checked;
    fixedFieldEl.style.display = isFixed ? "" : "none";
    commissionFieldEl.style.display = isFixed ? "none" : "";

    // Fixed interest: no price needed. Commission: price required.
    fixedRateInput.required = isFixed;
    commissionInput.required = !isFixed;
    priceInput.required = !isFixed;

    if (isFixed) {
      priceInput.value = "";
      commissionInput.value = "";
    } else {
      fixedRateInput.value = "";
    }
  }
  earnFixedRadio.addEventListener("change", syncEarnType);
  earnCommissionRadio.addEventListener("change", syncEarnType);
  syncEarnType();

  // Image picker (choose from gallery)
  const imageInput = document.getElementById("p-image");
  const imageBtn = document.getElementById("p-image-btn");
  const imagePreview = document.getElementById("p-image-preview");
  const imageNameEl = document.getElementById("p-image-name");
  let selectedImageFile = null;

  imageBtn.addEventListener("click", () => imageInput.click());

  imageInput.addEventListener("change", () => {
    const file = imageInput.files && imageInput.files[0];
    if (!file) {
      selectedImageFile = null;
      imagePreview.style.backgroundImage = "";
      imageNameEl.textContent = "No image selected";
      return;
    }
    selectedImageFile = file;
    imageNameEl.textContent = file.name;
    const reader = new FileReader();
    reader.onload = (e) => {
      imagePreview.style.backgroundImage = `url(${e.target.result})`;
    };
    reader.readAsDataURL(file);
  });

  let currentUser = null;

  (async () => {
    const { data: { session } } = await sb.auth.getSession();

    if (!session) {
      window.location.href = "login.html";
      return;
    }

    currentUser = session.user;
    userChip.textContent = currentUser.email;

    loadingEl.style.display = "none";
    contentEl.style.display = "";
  })();

  logoutBtn.addEventListener("click", async () => {
    await sb.auth.signOut();
    window.location.href = "login.html";
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msgEl.textContent = "";
    msgEl.className = "form-msg";

    const name = document.getElementById("p-name").value.trim();
    const description = document.getElementById("p-desc").value.trim();
    const earning_type = earnFixedRadio.checked ? "fixed" : "commission";

    const price = earning_type === "commission"
      ? parseFloat(priceInput.value)
      : null;
    const fixed_rate = earning_type === "fixed"
      ? parseFloat(fixedRateInput.value)
      : null;
    const commission_rate = earning_type === "commission"
      ? parseFloat(commissionInput.value)
      : null;
    const product_url = document.getElementById("p-url").value.trim() || null;

    if (
      !name || !description ||
      (earning_type === "fixed" && isNaN(fixed_rate)) ||
      (earning_type === "commission" && (isNaN(price) || isNaN(commission_rate)))
    ) {
      msgEl.textContent = "Please fill in all required fields.";
      msgEl.className = "form-msg error";
      return;
    }

    if (!selectedImageFile) {
      msgEl.textContent = "Please choose a product image.";
      msgEl.className = "form-msg error";
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Listing…";

    // ASSUMED STORAGE — bucket: product-images (public)
    // path convention: <owner_id>/<timestamp>-<filename>
    const path = `${currentUser.id}/${Date.now()}-${selectedImageFile.name}`;
    const { error: uploadErr } = await sb.storage
      .from("product-images")
      .upload(path, selectedImageFile);

    if (uploadErr) {
      submitBtn.disabled = false;
      submitBtn.textContent = "List product";
      msgEl.textContent = uploadErr.message || "Image upload failed. Please try again.";
      msgEl.className = "form-msg error";
      return;
    }

    const { data: publicUrlData } = sb.storage.from("product-images").getPublicUrl(path);
    const image_url = publicUrlData && publicUrlData.publicUrl ? publicUrlData.publicUrl : null;

    // ASSUMED SCHEMA — table: products
    // columns: id (uuid, default), owner_id (uuid, fk auth.users), name (text),
    // description (text), price (numeric, nullable — only set for commission type),
    // earning_type (text: 'fixed' | 'commission'),
    // fixed_rate (numeric, nullable, %), commission_rate (numeric, nullable, %),
    // product_url (text, nullable), image_url (text, not null), status (text, default 'active'),
    // created_at (timestamptz, default now())
    const { error } = await sb.from("products").insert({
      owner_id: currentUser.id,
      name,
      description,
      price,
      earning_type,
      fixed_rate,
      commission_rate,
      product_url,
      image_url,
      status: "active",
    });

    submitBtn.disabled = false;
    submitBtn.textContent = "List product";

    if (error) {
      msgEl.textContent = error.message || "Something went wrong. Please try again.";
      msgEl.className = "form-msg error";
      return;
    }

    msgEl.textContent = "Product listed. Redirecting to your dashboard…";
    msgEl.className = "form-msg success";
    form.reset();
    setTimeout(() => { window.location.href = "dashboard.html"; }, 1200);
  });
</script>

</body>
</html>
