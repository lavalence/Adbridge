<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Add a Product — ADbridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
<style>
  /* Page-only additions — scoped here since these are new patterns not in styles.css */
  .form-card {
    max-width: 560px;
    margin: 0 auto;
  }
  .form-field { margin-bottom: 18px; }
  .form-field label {
    display: block;
    font-size: 13px;
    color: #93A0B4;
    margin-bottom: 6px;
  }
  .form-field input,
  .form-field textarea {
    width: 100%;
    box-sizing: border-box;
    background: rgba(233,236,241,0.04);
    border: 1px solid rgba(233,236,241,0.18);
    border-radius: 8px;
    padding: 10px 12px;
    color: #E9ECF1;
    font-family: "Inter", sans-serif;
    font-size: 14px;
  }
  .form-field textarea { min-height: 90px; resize: vertical; }
  .form-row { display: flex; gap: 16px; }
  .form-row .form-field { flex: 1; }
  .form-msg { font-size: 14px; margin-top: 10px; min-height: 20px; }
  .form-msg.error { color: #FF6B6B; }
  .form-msg.success { color: #4ADE80; }
  .dash-loading { padding: 60px 0; text-align: center; color: #93A0B4; }
  .user-chip { color: #93A0B4; font-size: 14px; }
</style>
</head>
<body>

<nav class="nav">
  <div class="wrap">
    <a href="index.html" class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 26 18" fill="none">
          <path d="M1 15 C 6 4, 20 4, 25 15" stroke="#FFB020" stroke-width="2" stroke-linecap="round"/>
          <circle cx="1" cy="15" r="2" fill="#E9ECF1"/>
          <circle cx="25" cy="15" r="2" fill="#E9ECF1"/>
        </svg>
      </span>
      ADbridge
    </a>
    <div class="nav-links"></div>
    <div class="nav-links">
      <span class="user-chip" id="user-chip"></span>
      <button type="button" class="btn btn-ghost" id="logout-btn">Log out</button>
    </div>
  </div>
</nav>

<div id="dash-loading" class="wrap dash-loading">Loading…</div>

<div id="dash-content" style="display:none;">

  <header class="wrap section-border">
    <div class="section-head">
      <h2>Add a product</h2>
      <p>List a product for earners to promote.</p>
    </div>
  </header>

  <section class="wrap">
    <form id="product-form" class="form-card">
      <div class="form-field">
        <label for="p-name">Product name</label>
        <input type="text" id="p-name" required maxlength="120" />
      </div>

      <div class="form-field">
        <label for="p-desc">Description</label>
        <textarea id="p-desc" required maxlength="1000"></textarea>
      </div>

      <div class="form-row">
        <div class="form-field">
          <label for="p-price">Price (₦)</label>
          <input type="number" id="p-price" min="0" step="0.01" required />
        </div>
        <div class="form-field">
          <label for="p-commission">Commission (%)</label>
          <input type="number" id="p-commission" min="0" max="100" step="0.1" required />
        </div>
      </div>

      <div class="form-field">
        <label for="p-url">Product URL</label>
        <input type="url" id="p-url" placeholder="https://" required />
      </div>

      <div class="form-field">
        <label for="p-image">Image URL (optional)</label>
        <input type="url" id="p-image" placeholder="https://" />
      </div>

      <button type="submit" class="btn btn-primary" id="submit-btn">List product</button>
      <div class="form-msg" id="form-msg"></div>
    </form>
  </section>

</div>

<footer class="wrap">
  <span>© 2026 ADbridge</span>
  <span>Built on a verified payout pipeline</span>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
  const loadingEl = document.getElementById("dash-loading");
  const contentEl = document.getElementById("dash-content");
  const userChip = document.getElementById("user-chip");
  const logoutBtn = document.getElementById("logout-btn");
  const form = document.getElementById("product-form");
  const submitBtn = document.getElementById("submit-btn");
  const msgEl = document.getElementById("form-msg");

  let currentUser = null;

  (async () => {
    const { data: { session } } = await sb.auth.getSession();

    if (!session) {
      window.location.href = "login.html";
      return;
    }

    currentUser = session.user;
    userChip.textContent = currentUser.email;

    loadingEl.style.display = "none";
    contentEl.style.display = "";
  })();

  logoutBtn.addEventListener("click", async () => {
    await sb.auth.signOut();
    window.location.href = "login.html";
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msgEl.textContent = "";
    msgEl.className = "form-msg";

    const name = document.getElementById("p-name").value.trim();
    const description = document.getElementById("p-desc").value.trim();
    const price = parseFloat(document.getElementById("p-price").value);
    const commission_rate = parseFloat(document.getElementById("p-commission").value);
    const product_url = document.getElementById("p-url").value.trim();
    const image_url = document.getElementById("p-image").value.trim() || null;

    if (!name || !description || isNaN(price) || isNaN(commission_rate) || !product_url) {
      msgEl.textContent = "Please fill in all required fields.";
      msgEl.className = "form-msg error";
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Listing…";

    // ASSUMED SCHEMA — table: products
    // columns: id (uuid, default), owner_id (uuid, fk auth.users), name (text),
    // description (text), price (numeric), commission_rate (numeric),
    // product_url (text), image_url (text, nullable), status (text, default 'active'),
    // created_at (timestamptz, default now())
    const { error } = await sb.from("products").insert({
      owner_id: currentUser.id,
      name,
      description,
      price,
      commission_rate,
      product_url,
      image_url,
      status: "active",
    });

    submitBtn.disabled = false;
    submitBtn.textContent = "List product";

    if (error) {
      msgEl.textContent = error.message || "Something went wrong. Please try again.";
      msgEl.className = "form-msg error";
      return;
    }

    msgEl.textContent = "Product listed. Redirecting to your dashboard…";
    msgEl.className = "form-msg success";
    form.reset();
    setTimeout(() => { window.location.href = "dashboard.html"; }, 1200);
  });
</script>

</body>
</html>
