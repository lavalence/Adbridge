<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create your account — ADbridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #4A5FE8;
    --blue-dark: #3B4ED1;
    --ink: #101828;
    --muted: #6B7385;
    --faint: #93A0B4;
    --line: #E7EAF0;
    --bg: #F6F7FB;
    --card: #FFFFFF;
    --red: #E0554F;
    --red-bg: #FDECEC;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 20px; }

  /* ---------- nav ---------- */
  .nav { background: var(--card); border-bottom: 1px solid var(--line); }
  .nav .wrap {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding-top: 18px;
    padding-bottom: 18px;
    flex-wrap: wrap;
  }
  .brand {
    display: flex;
    flex-direction: column;
    text-decoration: none;
    color: var(--ink);
    line-height: 1.15;
  }
  .brand-name { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
  .brand-name span { color: var(--blue); }
  .brand-tag { font-size: 12.5px; color: var(--faint); margin-top: 1px; }

  .nav-links { display: flex; align-items: center; gap: 12px; font-size: 14.5px; color: var(--muted); }
  .pill-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 20px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    font-size: 14.5px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    text-decoration: none;
    transition: background .12s ease, border-color .12s ease;
  }
  .pill-btn:hover { background: var(--grey-bg); border-color: #D8DCE4; }

  /* ---------- auth shell ---------- */
  .auth-shell {
    max-width: 480px;
    margin: 0 auto;
    padding: 48px 20px 60px;
  }
  .auth-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 34px 30px 30px;
  }
  .auth-back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 20px;
  }
  .auth-back:hover { color: var(--ink); }
  .auth-card h1 {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.01em;
    margin: 0 0 8px;
  }
  .auth-sub {
    color: var(--muted);
    font-size: 15px;
    line-height: 1.5;
    margin: 0 0 26px;
  }

  .field { margin-bottom: 18px; }
  .field label {
    display: block;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    box-sizing: border-box;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 11px 13px;
    color: var(--ink);
    font-family: inherit;
    font-size: 14.5px;
    transition: border-color .12s ease;
  }
  .field input:focus { outline: none; border-color: var(--blue); }
  .field input.err { border-color: var(--red); }
  .field-error { font-size: 12.5px; color: var(--red); margin-top: 6px; min-height: 15px; }

  .password-field { position: relative; }
  .password-field input { padding-right: 44px; }
  .password-toggle {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    width: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--faint);
    padding: 0;
  }
  .password-toggle:hover { color: var(--ink); }
  .password-toggle svg { width: 20px; height: 20px; }
  .password-toggle .icon-off { display: none; }
  .password-toggle.is-visible .icon-on { display: none; }
  .password-toggle.is-visible .icon-off { display: block; }

  .form-msg { font-size: 14px; margin: 4px 0 4px; min-height: 20px; font-weight: 500; display: none; }
  .form-msg.show { display: block; }
  .form-msg.error { color: var(--red); }
  .form-msg.success { color: #1FA971; }

  .auth-submit { margin-top: 8px; }
  .btn-primary {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 16px 20px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--blue), var(--blue-dark));
    color: #fff;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    box-shadow: 0 10px 24px -10px rgba(74, 95, 232, 0.55);
    transition: transform .1s ease, box-shadow .1s ease, opacity .1s ease;
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 14px 28px -10px rgba(74, 95, 232, 0.6); }
  .btn-primary:disabled { opacity: .65; cursor: default; transform: none; }

  .auth-foot {
    text-align: center;
    color: var(--faint);
    font-size: 13.5px;
    margin: 18px 0 0;
  }
  .auth-foot a { color: var(--blue); font-weight: 600; text-decoration: none; }
  .auth-foot a:hover { text-decoration: underline; }

  @media (max-width: 480px) {
    .auth-card { padding: 28px 20px 24px; }
  }
</style>
</head>
<body>

<nav class="nav">
  <div class="wrap">
    <a href="index.html" class="brand">
      <span class="brand-name">AD<span>bridge</span></span>
      <span class="brand-tag">Promote products. Earn on every campaign.</span>
    </a>
    <div class="nav-links">
      <span>Already have an account?</span>
      <a href="login.html" class="pill-btn">Log in</a>
    </div>
  </div>
</nav>

<div class="auth-shell">
  <div class="auth-card">
    <a href="index.html" class="auth-back">&larr; Back to ADbridge</a>
    <h1>Create your account</h1>
    <p class="auth-sub">We'll send a 6-digit code to your email to confirm it's you.</p>

    <form id="signup-form" novalidate>
      <div class="field">
        <label for="fullname">Full name</label>
        <input type="text" id="fullname" name="fullname" autocomplete="name" required />
        <div class="field-error" id="fullname-error"></div>
      </div>

      <div class="field">
        <label for="dob">Date of birth</label>
        <input type="date" id="dob" name="dob" autocomplete="bday" required />
        <div class="field-error" id="dob-error"></div>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required />
        <div class="field-error" id="email-error"></div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="password-field">
          <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8" />
          <button type="button" class="password-toggle" data-target="password" aria-label="Show password" aria-pressed="false">
            <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a20.3 20.3 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a20.3 20.3 0 0 1-2.68 3.68M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
              <path d="M1 1l22 22"/>
            </svg>
          </button>
        </div>
        <div class="field-error" id="password-error"></div>
      </div>

      <div class="field">
        <label for="confirm">Confirm password</label>
        <div class="password-field">
          <input type="password" id="confirm" name="confirm" autocomplete="new-password" required minlength="8" />
          <button type="button" class="password-toggle" data-target="confirm" aria-label="Show password" aria-pressed="false">
            <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a20.3 20.3 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a20.3 20.3 0 0 1-2.68 3.68M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
              <path d="M1 1l22 22"/>
            </svg>
          </button>
        </div>
        <div class="field-error" id="confirm-error"></div>
      </div>

      <div class="form-msg" id="form-msg"></div>

      <div class="auth-submit">
        <button type="submit" class="btn-primary" id="submit-btn">Create account</button>
      </div>
    </form>

    <p class="auth-foot">By continuing you agree to receive a verification email from ADbridge.</p>
    <p class="auth-foot">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
  const form = document.getElementById("signup-form");
  const fullnameInput = document.getElementById("fullname");
  const dobInput = document.getElementById("dob");
  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");
  const confirmInput = document.getElementById("confirm");
  const submitBtn = document.getElementById("submit-btn");
  const formMsg = document.getElementById("form-msg");

  // Password show/hide toggles
  document.querySelectorAll(".password-toggle").forEach((btn) => {
    btn.addEventListener("click", () => {
      const target = document.getElementById(btn.dataset.target);
      const isVisible = target.type === "text";
      target.type = isVisible ? "password" : "text";
      btn.classList.toggle("is-visible", !isVisible);
      btn.setAttribute("aria-pressed", String(!isVisible));
      btn.setAttribute("aria-label", isVisible ? "Show password" : "Hide password");
    });
  });

  function clearErrors() {
    document.querySelectorAll(".field-error").forEach((el) => (el.textContent = ""));
    document.querySelectorAll(".field input").forEach((el) => el.classList.remove("err"));
    formMsg.className = "form-msg";
    formMsg.textContent = "";
  }

  function fieldError(input, message) {
    input.classList.add("err");
    document.getElementById(input.id + "-error").textContent = message;
  }

  function showMsg(text, kind) {
    formMsg.textContent = text;
    formMsg.className = "form-msg show " + kind;
  }

  function calcAge(dobStr) {
    const dob = new Date(dobStr);
    const today = new Date();
    let age = today.getFullYear() - dob.getFullYear();
    const monthDiff = today.getMonth() - dob.getMonth();
    if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < dob.getDate())) {
      age--;
    }
    return age;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    clearErrors();

    const fullname = fullnameInput.value.trim();
    const dob = dobInput.value;
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    const confirm = confirmInput.value;
    let hasError = false;

    if (fullname.length < 2) {
      fieldError(fullnameInput, "Enter your full name.");
      hasError = true;
    }
    if (!dob) {
      fieldError(dobInput, "Enter your date of birth.");
      hasError = true;
    } else if (calcAge(dob) < 18) {
      fieldError(dobInput, "You must be at least 18 years old.");
      hasError = true;
    }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      fieldError(emailInput, "Enter a valid email address.");
      hasError = true;
    }
    if (password.length < 8) {
      fieldError(passwordInput, "Use at least 8 characters.");
      hasError = true;
    }
    if (confirm !== password) {
      fieldError(confirmInput, "Passwords don't match.");
      hasError = true;
    }
    if (hasError) return;

    submitBtn.disabled = true;
    submitBtn.textContent = "Creating account…";

    const { data, error } = await sb.auth.signUp({
      email,
      password,
      options: {
        data: {
          full_name: fullname,
          date_of_birth: dob,
        },
      },
    });

    submitBtn.disabled = false;
    submitBtn.textContent = "Create account";

    if (error) {
      showMsg(error.message, "error");
      return;
    }

    // Stash the email so the OTP page knows who it's verifying.
    sessionStorage.setItem("adbridge_pending_email", email);
    window.location.href = "otp.html?flow=signup";
  });
</script>

</body>
</html>
