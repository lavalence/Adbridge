<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Promote — ADbridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
<style>
  /* Page-only additions — scoped here since these are new patterns not in styles.css */
  .dash-loading { padding: 60px 0; text-align: center; color: #93A0B4; }
  .user-chip { color: #93A0B4; font-size: 14px; }
  .nav-actions {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 14.5px;
  }
  @media (max-width: 880px) {
    .user-chip { display: none; }
  }

  .promote-card { max-width: 560px; margin: 0 auto; }

  .product-summary {
    display: flex;
    gap: 16px;
    align-items: center;
    padding: 18px;
    border: 1px solid rgba(233,236,241,0.14);
    border-radius: 12px;
    margin-bottom: 32px;
  }
  .product-summary img {
    width: 64px;
    height: 64px;
    object-fit: cover;
    border-radius: 8px;
    background: rgba(233,236,241,0.06);
    flex-shrink: 0;
  }
  .product-summary h3 { margin: 0 0 4px; font-size: 16px; }
  .product-summary p { margin: 0; color: #93A0B4; font-size: 13px; }
  .product-summary .rate { color: #FFB020; font-size: 13px; margin-top: 4px; }

  .budget-amount {
    font-family: "Space Grotesk", sans-serif;
    font-size: 40px;
    color: #E9ECF1;
    text-align: center;
    margin: 8px 0 20px;
  }

  .budget-slider {
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    border-radius: 999px;
    background: rgba(233,236,241,0.18);
    outline: none;
    margin: 10px 0 6px;
  }
  .budget-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #FFB020;
    cursor: pointer;
    border: 3px solid #0a0f1a;
  }
  .budget-slider::-moz-range-thumb {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #FFB020;
    cursor: pointer;
    border: 3px solid #0a0f1a;
  }
  .budget-range-labels {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #93A0B4;
    margin-bottom: 28px;
  }

  .budget-presets {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 24px;
  }
  .budget-presets button {
    padding: 10px 8px;
    border: 1px solid rgba(233,236,241,0.18);
    border-radius: 8px;
    background: transparent;
    color: #E9ECF1;
    font-family: inherit;
    font-size: 13.5px;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .budget-presets button:hover { border-color: #93A0B4; }
  .budget-presets button.active {
    border-color: #FFB020;
    background: rgba(255,176,32,0.08);
    color: #FFB020;
  }

  .form-field { margin-bottom: 18px; }
  .form-field label {
    display: block;
    font-size: 13px;
    color: #93A0B4;
    margin-bottom: 6px;
  }
  .form-field input {
    width: 100%;
    box-sizing: border-box;
    background: rgba(233,236,241,0.04);
    border: 1px solid rgba(233,236,241,0.18);
    border-radius: 8px;
    padding: 10px 12px;
    color: #E9ECF1;
    font-family: "Inter", sans-serif;
    font-size: 14px;
  }

  .form-msg { font-size: 14px; margin-top: 10px; min-height: 20px; }
  .form-msg.error { color: #FF6B6B; }
  .form-msg.success { color: #4ADE80; }

  .empty-state {
    border: 1px dashed rgba(233,236,241,0.18);
    border-radius: 12px;
    padding: 32px 24px;
    text-align: center;
    color: #93A0B4;
    max-width: 560px;
    margin: 0 auto;
  }
</style>
</head>
<body>

<nav class="nav">
  <div class="wrap">
    <a href="index.html" class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 26 18" fill="none">
          <path d="M1 15 C 6 4, 20 4, 25 15" stroke="#FFB020" stroke-width="2" stroke-linecap="round"/>
          <circle cx="1" cy="15" r="2" fill="#E9ECF1"/>
          <circle cx="25" cy="15" r="2" fill="#E9ECF1"/>
        </svg>
      </span>
      ADbridge
    </a>
    <div class="nav-links"></div>
    <div class="nav-actions">
      <span class="user-chip" id="user-chip"></span>
      <button type="button" class="btn btn-ghost" id="logout-btn">Log out</button>
    </div>
  </div>
</nav>

<div id="dash-loading" class="wrap dash-loading">Loading…</div>

<div id="dash-content" class="wrap" style="display:none; padding-top: 48px;">

  <div class="section-head" style="margin-bottom: 32px;">
    <h2>Set your promotion budget</h2>
    <p>Choose how much you want to put behind this campaign.</p>
  </div>

  <div id="product-missing" class="empty-state" style="display:none;">
    <p>We couldn't find that product. Head back and pick one to promote.</p>
    <a href="browse.html" class="btn btn-ghost">Browse products</a>
  </div>

  <div id="promote-body" style="display:none;">
    <div class="promote-card">
      <div class="product-summary">
        <img id="ps-image" src="" alt="" />
        <div>
          <h3 id="ps-name"></h3>
          <p id="ps-desc"></p>
          <div class="rate" id="ps-rate"></div>
        </div>
      </div>

      <form id="promote-form">
        <div class="budget-amount" id="budget-display">₦2,000</div>

        <input
          type="range"
          class="budget-slider"
          id="budget-slider"
          min="2000"
          max="100000"
          step="500"
          value="2000"
        />
        <div class="budget-range-labels">
          <span>₦2,000</span>
          <span>₦100,000</span>
        </div>

        <div class="budget-presets" id="budget-presets">
          <button type="button" data-amount="2000">₦2,000</button>
          <button type="button" data-amount="5000">₦5,000</button>
          <button type="button" data-amount="10000">₦10,000</button>
          <button type="button" data-amount="25000">₦25,000</button>
          <button type="button" data-amount="50000">₦50,000</button>
          <button type="button" data-amount="100000">₦100,000</button>
        </div>

        <div class="form-field">
          <label for="budget-custom">Or enter a custom amount (₦2,000 – ₦100,000)</label>
          <input type="number" id="budget-custom" min="2000" max="100000" step="1" />
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Start campaign</button>
        <div class="form-msg" id="form-msg"></div>
      </form>
    </div>
  </div>

</div>

<footer class="wrap">
  <span>© 2026 ADbridge</span>
  <span>Built on a verified payout pipeline</span>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
  const MIN_BUDGET = 2000;
  const MAX_BUDGET = 100000;

  const loadingEl = document.getElementById("dash-loading");
  const contentEl = document.getElementById("dash-content");
  const userChip = document.getElementById("user-chip");
  const logoutBtn = document.getElementById("logout-btn");

  const productMissingEl = document.getElementById("product-missing");
  const promoteBodyEl = document.getElementById("promote-body");

  const psImage = document.getElementById("ps-image");
  const psName = document.getElementById("ps-name");
  const psDesc = document.getElementById("ps-desc");
  const psRate = document.getElementById("ps-rate");

  const form = document.getElementById("promote-form");
  const submitBtn = document.getElementById("submit-btn");
  const msgEl = document.getElementById("form-msg");

  const budgetDisplay = document.getElementById("budget-display");
  const budgetSlider = document.getElementById("budget-slider");
  const budgetCustom = document.getElementById("budget-custom");
  const presetButtons = document.querySelectorAll("#budget-presets button");

  function naira(n) {
    return "₦" + Number(n || 0).toLocaleString();
  }

  function setBudget(amount) {
    const clamped = Math.min(MAX_BUDGET, Math.max(MIN_BUDGET, Math.round(amount)));
    budgetDisplay.textContent = naira(clamped);
    budgetSlider.value = clamped;
    budgetCustom.value = clamped;
    presetButtons.forEach((btn) => {
      btn.classList.toggle("active", Number(btn.dataset.amount) === clamped);
    });
    return clamped;
  }

  budgetSlider.addEventListener("input", () => setBudget(budgetSlider.value));
  budgetCustom.addEventListener("change", () => setBudget(budgetCustom.value || MIN_BUDGET));
  presetButtons.forEach((btn) => {
    btn.addEventListener("click", () => setBudget(btn.dataset.amount));
  });

  setBudget(MIN_BUDGET);

  let currentUser = null;
  let currentProduct = null;

  (async () => {
    const { data: { session } } = await sb.auth.getSession();

    if (!session) {
      window.location.href = "login.html";
      return;
    }

    currentUser = session.user;
    userChip.textContent = currentUser.email;

    const params = new URLSearchParams(window.location.search);
    const productId = params.get("product");

    loadingEl.style.display = "none";
    contentEl.style.display = "";

    if (!productId) {
      productMissingEl.style.display = "";
      return;
    }

    // ASSUMED SCHEMA — table: products
    // columns as listed in product.html (name, description, price, earning_type,
    // fixed_rate, commission_rate, image_url, status)
    const { data: product, error } = await sb
      .from("products")
      .select("id, name, description, price, earning_type, fixed_rate, commission_rate, image_url, owner_id, status")
      .eq("id", productId)
      .single();

    if (error || !product) {
      productMissingEl.style.display = "";
      return;
    }

    currentProduct = product;

    psImage.src = product.image_url || "";
    psImage.alt = product.name;
    psName.textContent = product.name;
    psDesc.textContent = product.description || "";
    psRate.textContent = product.earning_type === "fixed"
      ? `${Number(product.fixed_rate)}% fixed interest`
      : `${Number(product.commission_rate)}% commission`;

    promoteBodyEl.style.display = "";
  })();

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msgEl.textContent = "";
    msgEl.className = "form-msg";

    const budget = setBudget(budgetCustom.value || budgetSlider.value);

    if (!currentProduct) {
      msgEl.textContent = "Missing product — please go back and pick one to promote.";
      msgEl.className = "form-msg error";
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Starting…";

    // ASSUMED SCHEMA — table: campaigns
    // columns: id (uuid, default), earner_id (uuid, fk auth.users),
    // product_id (uuid, fk products.id), status (text, default 'active'),
    // budget (numeric — the amount this earner is putting behind the campaign),
    // created_at (timestamptz, default now())
    const { error } = await sb.from("campaigns").insert({
      earner_id: currentUser.id,
      product_id: currentProduct.id,
      status: "active",
      budget,
    });

    submitBtn.disabled = false;
    submitBtn.textContent = "Start campaign";

    if (error) {
      msgEl.textContent = error.message || "Couldn't start the campaign. Please try again.";
      msgEl.className = "form-msg error";
      return;
    }

    msgEl.textContent = "Campaign started. Redirecting to your dashboard…";
    msgEl.className = "form-msg success";
    setTimeout(() => { window.location.href = "dashboard.html"; }, 1200);
  });

  logoutBtn.addEventListener("click", async () => {
    await sb.auth.signOut();
    window.location.href = "login.html";
  });
</script>

</body>
</html>
