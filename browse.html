<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Browse Products — ADbridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #4A5FE8;
    --blue-dark: #3B4ED1;
    --ink: #101828;
    --muted: #6B7385;
    --faint: #93A0B4;
    --line: #E7EAF0;
    --bg: #F6F7FB;
    --card: #FFFFFF;
    --green-bg: #E7F8EF;
    --green: #1FA971;
    --grey-bg: #F1F2F5;
    --amber-bg: #FFF4E0;
    --amber: #B45309;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 20px; }

  /* ---------- nav ---------- */
  .nav { background: var(--card); border-bottom: 1px solid var(--line); }
  .nav .wrap {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding-top: 18px;
    padding-bottom: 18px;
    flex-wrap: wrap;
  }
  .brand {
    display: flex;
    flex-direction: column;
    text-decoration: none;
    color: var(--ink);
    line-height: 1.15;
  }
  .brand-name {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  .brand-name span { color: var(--blue); }
  .brand-tag { font-size: 12.5px; color: var(--faint); margin-top: 1px; }

  .nav-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .pill-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 20px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    font-size: 14.5px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    text-decoration: none;
    transition: background .12s ease, border-color .12s ease;
  }
  .pill-btn:hover { background: var(--grey-bg); border-color: #D8DCE4; }
  .user-chip {
    color: var(--faint);
    font-size: 13.5px;
    padding-right: 4px;
  }
  @media (max-width: 640px) { .user-chip { display: none; } }

  /* ---------- header ---------- */
  .dash-header { padding: 40px 0 8px; }
  .eyebrow {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--blue);
    margin: 0 0 12px;
  }
  .dash-header h1 {
    font-size: 38px;
    line-height: 1.15;
    font-weight: 800;
    letter-spacing: -0.01em;
    margin: 0 0 14px;
  }
  .dash-header p {
    font-size: 16px;
    color: var(--muted);
    max-width: 46ch;
    margin: 0;
    line-height: 1.5;
  }

  .dash-loading { padding: 60px 0; text-align: center; color: var(--faint); }

  /* ---------- search ---------- */
  .search-row { margin: 28px 0 24px; }
  .search-row input {
    width: 100%;
    box-sizing: border-box;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 14px 20px;
    color: var(--ink);
    font-family: inherit;
    font-size: 14.5px;
    transition: border-color .12s ease;
  }
  .search-row input::placeholder { color: var(--faint); }
  .search-row input:focus {
    outline: none;
    border-color: var(--blue);
  }

  /* ---------- product grid ---------- */
  .product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 20px;
    padding-bottom: 48px;
  }
  .product-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 18px;
    display: flex;
    flex-direction: column;
  }
  .product-card img {
    width: 100%;
    height: 140px;
    object-fit: cover;
    border-radius: 12px;
    margin-bottom: 14px;
    background: var(--grey-bg);
    cursor: zoom-in;
  }
  .product-card h3 {
    margin: 0 0 6px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .product-card p {
    margin: 0 0 14px;
    color: var(--muted);
    font-size: 13.5px;
    line-height: 1.45;
    flex-grow: 1;
  }
  .product-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    margin-bottom: 14px;
  }
  .product-meta .price { color: var(--ink); font-weight: 700; }
  .product-meta .commission {
    color: var(--amber);
    background: var(--amber-bg);
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
  }

  .btn-primary {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 13px 18px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--blue), var(--blue-dark));
    color: #fff;
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    box-shadow: 0 10px 24px -10px rgba(74, 95, 232, 0.55);
    transition: transform .1s ease, box-shadow .1s ease, opacity .1s ease;
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 14px 28px -10px rgba(74, 95, 232, 0.6); }
  .btn-primary:disabled {
    background: var(--grey-bg);
    color: var(--faint);
    box-shadow: none;
    cursor: default;
    transform: none;
  }

  .empty-state {
    border: 1.5px dashed var(--line);
    border-radius: 16px;
    padding: 32px 24px;
    text-align: center;
    color: var(--muted);
    font-size: 14.5px;
  }
  .empty-state p { margin: 0; }

  /* ---------- lightbox ---------- */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(16, 24, 40, 0.88);
    z-index: 50;
    align-items: center;
    justify-content: center;
    padding: 24px;
    cursor: zoom-out;
  }
  .lightbox.open { display: flex; }
  .lightbox img {
    max-width: min(90vw, 720px);
    max-height: 85vh;
    object-fit: contain;
    border-radius: 12px;
  }
  .lightbox-close {
    position: absolute;
    top: 20px;
    right: 24px;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--ink);
    width: 38px;
    height: 38px;
    border-radius: 999px;
    font-size: 16px;
    cursor: pointer;
  }
  .lightbox-close:hover { background: var(--grey-bg); }

  footer {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    padding: 46px 20px 40px;
    max-width: 980px;
    margin: 0 auto;
    color: var(--faint);
    font-size: 13px;
  }

  @media (max-width: 480px) {
    .dash-header h1 { font-size: 30px; }
  }
</style>
</head>
<body>

<nav class="nav">
  <div class="wrap">
    <a href="index.html" class="brand">
      <span class="brand-name">AD<span>bridge</span></span>
      <span class="brand-tag">Promote products. Earn on every campaign.</span>
    </a>
    <div class="nav-actions">
      <span class="user-chip" id="user-chip"></span>
      <button type="button" class="pill-btn" id="logout-btn">Log out</button>
    </div>
  </div>
</nav>

<div id="dash-loading" class="wrap dash-loading">Loading…</div>

<div id="dash-content" style="display:none;">

  <header class="wrap dash-header">
    <p class="eyebrow">BROWSE PRODUCTS</p>
    <h1>Find something to promote</h1>
    <p>Pick a product to promote and start earning commission.</p>
  </header>

  <section class="wrap">
    <div class="search-row">
      <input type="text" id="search-input" placeholder="Search products…" />
    </div>
    <div id="grid-loading" class="dash-loading" style="padding:30px 0;">Loading products…</div>
    <div class="empty-state" id="products-empty" style="display:none;">
      <p>No products available to promote right now.</p>
    </div>
    <div class="product-grid" id="product-grid"></div>
  </section>

</div>

<div class="lightbox" id="lightbox">
  <button type="button" class="lightbox-close" id="lightbox-close">✕</button>
  <img id="lightbox-img" src="" alt="" />
</div>

<footer>
  <span>© 2026 ADbridge</span>
  <span>Built on a verified payout pipeline</span>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
  const loadingEl = document.getElementById("dash-loading");
  const contentEl = document.getElementById("dash-content");
  const userChip = document.getElementById("user-chip");
  const logoutBtn = document.getElementById("logout-btn");
  const gridEl = document.getElementById("product-grid");
  const gridLoadingEl = document.getElementById("grid-loading");
  const emptyEl = document.getElementById("products-empty");
  const searchInput = document.getElementById("search-input");

  const lightboxEl = document.getElementById("lightbox");
  const lightboxImgEl = document.getElementById("lightbox-img");
  const lightboxCloseEl = document.getElementById("lightbox-close");

  let currentUser = null;
  let allProducts = [];
  let myCampaignProductIds = new Set();

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function openLightbox(src, alt) {
    lightboxImgEl.src = src;
    lightboxImgEl.alt = alt;
    lightboxEl.classList.add("open");
  }

  function closeLightbox() {
    lightboxEl.classList.remove("open");
    lightboxImgEl.src = "";
  }

  lightboxEl.addEventListener("click", closeLightbox);
  lightboxCloseEl.addEventListener("click", (e) => { e.stopPropagation(); closeLightbox(); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeLightbox();
  });

  function render(products) {
    gridEl.innerHTML = "";

    if (products.length === 0) {
      emptyEl.style.display = "";
      return;
    }
    emptyEl.style.display = "none";

    products.forEach((p) => {
      const card = document.createElement("div");
      card.className = "product-card";

      const alreadyPromoting = myCampaignProductIds.has(p.id);

      card.innerHTML = `
        ${p.image_url ? `<img src="${escapeHtml(p.image_url)}" alt="${escapeHtml(p.name)}" data-full="${escapeHtml(p.image_url)}" class="product-photo" />` : ""}
        <h3>${escapeHtml(p.name)}</h3>
        <p>${escapeHtml(p.description)}</p>
        <div class="product-meta">
          ${p.price != null ? `<span class="price">₦${Number(p.price).toLocaleString()}</span>` : `<span class="price">Fixed interest</span>`}
          <span class="commission">${p.earning_type === "fixed" ? `${Number(p.fixed_rate)}% fixed` : `${Number(p.commission_rate)}% commission`}</span>
        </div>
        <button type="button" class="btn-primary promote-btn" data-id="${p.id}" data-name="${escapeHtml(p.name)}" ${alreadyPromoting ? "disabled" : ""}>
          ${alreadyPromoting ? "Already promoting" : "Promote this"}
        </button>
      `;
      gridEl.appendChild(card);
    });

    gridEl.querySelectorAll(".product-photo").forEach((img) => {
      img.addEventListener("click", () => openLightbox(img.dataset.full, img.alt));
    });

    gridEl.querySelectorAll(".promote-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        // Hand off to promote.html, where the user picks a promotion budget
        const params = new URLSearchParams({ product: btn.dataset.id });
        window.location.href = `promote.html?${params.toString()}`;
      });
    });
  }

  (async () => {
    const { data: { session } } = await sb.auth.getSession();

    if (!session) {
      window.location.href = "login.html";
      return;
    }

    currentUser = session.user;
    userChip.textContent = currentUser.email;

    loadingEl.style.display = "none";
    contentEl.style.display = "";

    const [{ data: products, error: productsErr }, { data: myCampaigns, error: campaignsErr }] = await Promise.all([
      sb.from("products").select("*").eq("status", "active").order("created_at", { ascending: false }),
      sb.from("campaigns").select("product_id").eq("earner_id", currentUser.id),
    ]);

    gridLoadingEl.style.display = "none";

    if (productsErr) {
      emptyEl.style.display = "";
      emptyEl.querySelector("p").textContent = "Couldn't load products right now.";
      return;
    }

    if (!campaignsErr && myCampaigns) {
      myCampaignProductIds = new Set(myCampaigns.map((c) => c.product_id));
    }

    // Don't show a user their own listed products in the browse list
    allProducts = (products || []).filter((p) => p.owner_id !== currentUser.id);
    render(allProducts);
  })();

  searchInput.addEventListener("input", () => {
    const q = searchInput.value.trim().toLowerCase();
    const filtered = !q
      ? allProducts
      : allProducts.filter(
          (p) =>
            p.name.toLowerCase().includes(q) ||
            (p.description || "").toLowerCase().includes(q)
        );
    render(filtered);
  });

  logoutBtn.addEventListener("click", async () => {
    await sb.auth.signOut();
    window.location.href = "login.html";
  });
</script>

</body>
</html>
